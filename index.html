<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Grid - 動画グリッドアプリ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-size: 2rem;
        }

        .controls {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: white;
        }

        input[type="number"] {
            width: 70px;
            padding: 8px 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            background: rgba(255,255,255,0.1);
            color: white;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #e94560;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560 0%, #0f3460 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4);
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #ee5a5a;
        }

        .grid-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .video-grid {
            display: grid;
            gap: 10px;
            justify-content: center;
        }

        .grid-cell {
            aspect-ratio: 16/9;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            border: 3px dashed rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            min-width: 200px;
            min-height: 112px;
        }

        .grid-cell:hover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }

        .grid-cell.has-video {
            border: none;
            background: #000;
        }

        .grid-cell video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 5px;
        }

        .grid-cell .placeholder {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            text-align: center;
            padding: 10px;
        }

        .grid-cell .placeholder-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .grid-cell .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            background: rgba(255, 107, 107, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
            z-index: 10;
        }

        .grid-cell.has-video:hover .delete-btn {
            display: flex;
        }

        .grid-cell .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .grid-cell.has-video:hover .play-overlay {
            opacity: 1;
        }

        .grid-cell.has-video.playing .play-overlay {
            opacity: 0;
        }

        .play-icon {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-icon::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 20px solid #1a1a2e;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            margin-left: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: white;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-btn {
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .modal-btn-icon {
            font-size: 24px;
        }

        .btn-camera {
            background: linear-gradient(135deg, #e94560 0%, #0f3460 100%);
            color: white;
        }

        .btn-gallery {
            background: linear-gradient(135deg, #0f3460 0%, #e94560 100%);
            color: white;
        }

        .btn-cancel {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        #fileInput {
            display: none;
        }

        .camera-preview {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 2000;
            flex-direction: column;
        }

        .camera-preview.active {
            display: flex;
        }

        .camera-preview video {
            flex: 1;
            object-fit: cover;
        }

        .camera-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .record-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #e94560;
            border: 4px solid white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .record-btn.recording {
            background: #ff0000;
            border-radius: 12px;
            width: 50px;
            height: 50px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .close-camera {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.3);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
        }

        .recording-time {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            background: rgba(255,0,0,0.7);
            padding: 8px 16px;
            border-radius: 8px;
            display: none;
        }

        .recording-time.active {
            display: block;
        }

        /* Fullscreen video modal */
        .fullscreen-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-modal.active {
            display: flex;
        }

        .fullscreen-modal video {
            max-width: 95%;
            max-height: 95%;
        }

        .fullscreen-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.3);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .control-row {
                flex-direction: column;
            }

            .grid-cell {
                min-width: 150px;
                min-height: 84px;
            }

            .grid-cell .placeholder {
                font-size: 12px;
            }

            .grid-cell .placeholder-icon {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Movie Grid</h1>

        <div class="controls">
            <div class="control-row">
                <div class="control-group">
                    <label for="rows">行数:</label>
                    <input type="number" id="rows" min="1" max="10" value="2">
                </div>
                <div class="control-group">
                    <label for="cols">列数:</label>
                    <input type="number" id="cols" min="1" max="10" value="2">
                </div>
                <button class="btn-primary" onclick="updateGrid()">グリッド更新</button>
                <button class="btn-danger" onclick="clearAllVideos()">全削除</button>
            </div>
        </div>

        <div class="grid-container">
            <div class="video-grid" id="videoGrid"></div>
        </div>
    </div>

    <!-- Video Selection Modal -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <h2>動画を追加</h2>
            <div class="modal-buttons">
                <button class="modal-btn btn-camera" onclick="openCamera()">
                    <span class="modal-btn-icon">🎥</span>
                    カメラで撮影
                </button>
                <button class="modal-btn btn-gallery" onclick="openGallery()">
                    <span class="modal-btn-icon">📁</span>
                    ファイルから選択
                </button>
                <button class="modal-btn btn-cancel" onclick="closeModal()">
                    キャンセル
                </button>
            </div>
        </div>
    </div>

    <!-- Camera Preview -->
    <div class="camera-preview" id="cameraPreview">
        <video id="cameraVideo" autoplay playsinline muted></video>
        <div class="recording-time" id="recordingTime">00:00</div>
        <button class="close-camera" onclick="closeCamera()">✕</button>
        <div class="camera-controls">
            <button class="record-btn" id="recordBtn" onclick="toggleRecording()"></button>
        </div>
    </div>

    <!-- Fullscreen Video Modal -->
    <div class="fullscreen-modal" id="fullscreenModal">
        <video id="fullscreenVideo" controls></video>
        <button class="fullscreen-close" onclick="closeFullscreen()">✕</button>
    </div>

    <input type="file" id="fileInput" accept="video/*">

    <script>
        let currentCellIndex = null;
        let videos = {};
        let stream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let recordingTimer = null;
        let recordingSeconds = 0;

        // Initialize grid on page load
        document.addEventListener('DOMContentLoaded', () => {
            updateGrid();
        });

        function updateGrid() {
            const rows = parseInt(document.getElementById('rows').value) || 2;
            const cols = parseInt(document.getElementById('cols').value) || 2;
            const grid = document.getElementById('videoGrid');

            // Calculate cell size based on container width
            const containerWidth = grid.parentElement.clientWidth - 40;
            const cellWidth = Math.min(Math.floor((containerWidth - (cols - 1) * 10) / cols), 400);

            grid.style.gridTemplateColumns = `repeat(${cols}, ${cellWidth}px)`;
            grid.innerHTML = '';

            const totalCells = rows * cols;

            for (let i = 0; i < totalCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.dataset.index = i;

                if (videos[i]) {
                    cell.classList.add('has-video');
                    cell.innerHTML = `
                        <video src="${videos[i]}" loop muted playsinline></video>
                        <div class="play-overlay"><div class="play-icon"></div></div>
                        <button class="delete-btn" onclick="deleteVideo(event, ${i})">✕</button>
                    `;

                    const video = cell.querySelector('video');

                    // Play on hover
                    cell.addEventListener('mouseenter', () => {
                        video.play();
                        cell.classList.add('playing');
                    });

                    cell.addEventListener('mouseleave', () => {
                        video.pause();
                        video.currentTime = 0;
                        cell.classList.remove('playing');
                    });

                    // Click to fullscreen
                    cell.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('delete-btn')) {
                            openFullscreen(videos[i]);
                        }
                    });
                } else {
                    cell.innerHTML = `
                        <div class="placeholder">
                            <div class="placeholder-icon">🎬</div>
                            <div>タップして動画を追加</div>
                        </div>
                    `;
                    cell.onclick = () => openModal(i);
                }

                grid.appendChild(cell);
            }
        }

        function openModal(cellIndex) {
            currentCellIndex = cellIndex;
            document.getElementById('videoModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('videoModal').classList.remove('active');
            currentCellIndex = null;
        }

        function openCamera() {
            closeModal();
            const preview = document.getElementById('cameraPreview');
            const video = document.getElementById('cameraVideo');

            navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' },
                audio: true
            })
            .then(s => {
                stream = s;
                video.srcObject = stream;
                preview.classList.add('active');
            })
            .catch(err => {
                console.error('Camera error:', err);
                alert('カメラにアクセスできませんでした。ファイルから選択してください。');
                openGallery();
            });
        }

        function closeCamera() {
            const preview = document.getElementById('cameraPreview');
            preview.classList.remove('active');

            if (isRecording) {
                stopRecording();
            }

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            resetRecordingUI();
        }

        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        function startRecording() {
            recordedChunks = [];

            const options = { mimeType: 'video/webm;codecs=vp9,opus' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options.mimeType = 'video/webm;codecs=vp8,opus';
            }
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options.mimeType = 'video/webm';
            }

            mediaRecorder = new MediaRecorder(stream, options);

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const videoURL = URL.createObjectURL(blob);
                videos[currentCellIndex] = videoURL;
                closeCamera();
                updateGrid();
            };

            mediaRecorder.start();
            isRecording = true;

            document.getElementById('recordBtn').classList.add('recording');
            document.getElementById('recordingTime').classList.add('active');

            recordingSeconds = 0;
            updateRecordingTime();
            recordingTimer = setInterval(updateRecordingTime, 1000);
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;

            if (recordingTimer) {
                clearInterval(recordingTimer);
                recordingTimer = null;
            }
        }

        function updateRecordingTime() {
            const mins = Math.floor(recordingSeconds / 60).toString().padStart(2, '0');
            const secs = (recordingSeconds % 60).toString().padStart(2, '0');
            document.getElementById('recordingTime').textContent = `${mins}:${secs}`;
            recordingSeconds++;
        }

        function resetRecordingUI() {
            document.getElementById('recordBtn').classList.remove('recording');
            document.getElementById('recordingTime').classList.remove('active');
            document.getElementById('recordingTime').textContent = '00:00';
            recordingSeconds = 0;
            if (recordingTimer) {
                clearInterval(recordingTimer);
                recordingTimer = null;
            }
        }

        function openGallery() {
            closeModal();
            document.getElementById('fileInput').click();
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const videoURL = URL.createObjectURL(file);
                videos[currentCellIndex] = videoURL;
                updateGrid();
            }
            this.value = '';
        });

        function deleteVideo(event, index) {
            event.stopPropagation();
            if (videos[index]) {
                URL.revokeObjectURL(videos[index]);
            }
            delete videos[index];
            updateGrid();
        }

        function clearAllVideos() {
            if (Object.keys(videos).length === 0) return;
            if (confirm('すべての動画を削除しますか?')) {
                Object.values(videos).forEach(url => URL.revokeObjectURL(url));
                videos = {};
                updateGrid();
            }
        }

        function openFullscreen(videoSrc) {
            const modal = document.getElementById('fullscreenModal');
            const video = document.getElementById('fullscreenVideo');
            video.src = videoSrc;
            modal.classList.add('active');
            video.play();
        }

        function closeFullscreen() {
            const modal = document.getElementById('fullscreenModal');
            const video = document.getElementById('fullscreenVideo');
            video.pause();
            video.src = '';
            modal.classList.remove('active');
        }

        // Close fullscreen on background click
        document.getElementById('fullscreenModal').addEventListener('click', (e) => {
            if (e.target.id === 'fullscreenModal') {
                closeFullscreen();
            }
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            updateGrid();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeFullscreen();
                closeModal();
                closeCamera();
            }
        });
    </script>
</body>
</html>
